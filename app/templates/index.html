<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Who Represents Me</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
    h1 { font-size: 1.6rem; }
    input { width: 70%; padding: 10px; font-size: 1rem; }
    button { padding: 10px 16px; font-size: 1rem; cursor: pointer; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 12px 0; }
    .label { font-size: 0.8rem; text-transform: uppercase; color: #666; letter-spacing: 0.05em; }
    .error { color: #b00020; }
  </style>
  {% if adsense_publisher_id %}
  <!-- Google AdSense - auto ads. Requires a real publisher ID and an
       approved AdSense account (manual application, Google reviews the
       site - can't be automated). Set ADSENSE_PUBLISHER_ID env var once
       you have one. -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ adsense_publisher_id }}" crossorigin="anonymous"></script>
  {% endif %}
</head>
<body>
  <div id="auth-bar" style="text-align:right; font-size:0.85rem; margin-bottom:8px;"></div>
  <h1>Who represents me?</h1>
  <p>Enter your address to see who represents you and what they actually control — no spin, just the facts.</p>
  <input id="address" type="text" placeholder="123 Main St, Scappoose, OR">
  <button onclick="doLookup()">Look up</button>
  <div id="results"></div>

  {% if adsense_publisher_id %}
  <!-- Placeholder ad slot - replace data-ad-slot with a real slot ID
       from your AdSense dashboard once approved. Placed below results,
       not above, so it never delays or competes with the actual civic
       info the visitor came for. -->
  <div style="margin-top:24px;">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="{{ adsense_publisher_id }}"
         data-ad-slot="REPLACE_WITH_REAL_SLOT_ID"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>
  {% endif %}

  <script>
    async function loadAuthBar() {
      const res = await fetch('/api/me');
      const data = await res.json();
      const bar = document.getElementById('auth-bar');
      if (!data.authenticated) {
        bar.innerHTML = '<a href="/login">Log in</a> · <a href="/signup">Sign up</a> · ' + donateWidget();
        return;
      }
      bar.innerHTML = `${data.email} · <a href="/logout">Log out</a> · ` + donateWidget();
    }

    function donateWidget() {
      return `<form action="/billing/donate" method="POST" style="display:inline">
        <input type="number" name="amount" min="1" step="1" value="5" style="width:50px; padding:2px;">
        <button type="submit" style="border:none;background:none;color:#06c;cursor:pointer;padding:0;font:inherit;">Support this project</button>
      </form>`;
    }
    loadAuthBar();

    async function doLookup() {
      const address = document.getElementById('address').value;
      const resultsEl = document.getElementById('results');
      resultsEl.innerHTML = '<p>Looking up...</p>';

      try {
        const res = await fetch(`/api/lookup?address=${encodeURIComponent(address)}`);
        const data = await res.json();

        if (data.error) {
          resultsEl.innerHTML = `<p class="error">${data.error}</p>`;
          return;
        }

        let html = `<div class="card"><div class="label">Matched address</div>${data.address}</div>`;

        if (data.federal.senators) {
          html += `<div class="card"><div class="label">US Senators</div>`;
          data.federal.senators.forEach(s => html += `${s.name} (${s.party}) — <a href="${s.site}" target="_blank">${s.site}</a><br>`);
          html += `</div>`;
        }

        if (data.federal.house_rep) {
          html += `<div class="card"><div class="label">US House Rep (District ${data.congressional_district})</div>${data.federal.house_rep.name}</div>`;
        }

        if (data.state_legislators && data.state_legislators.length) {
          html += `<div class="card"><div class="label">State Legislators</div>`;
          data.state_legislators.forEach(l => html += `${l.title || l.chamber}: ${l.name} (${l.party})<br>`);
          html += `</div>`;
        }

        if (data.local.note) {
          html += `<div class="card"><div class="label">Local</div>${data.local.note}</div>`;
        } else if (data.local.county_commissioners) {
          html += `<div class="card"><div class="label">County Commissioners</div>`;
          data.local.county_commissioners.forEach(c => html += `${c.name} — ${c.position}<br>`);
          html += `</div>`;
        }

        resultsEl.innerHTML = html;
      } catch (e) {
        resultsEl.innerHTML = `<p class="error">Something went wrong: ${e}</p>`;
      }
    }
  </script>
</body>
</html>
